name: Release AIDOO Whisper Lite for macOS

on:
  workflow_dispatch:
  push:
    tags: ["lite-v*"]

permissions:
  contents: read
  checks: write

concurrency:
  group: aidoo-whisper-lite-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.93.1
          targets: aarch64-apple-darwin
          components: clippy
      - name: Install locked Rust audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
      - name: Validate macOS release configuration
        run: python3 scripts/check-release-config.py
      - name: Validate macOS dependency boundary
        run: python3 scripts/check-macos-dependencies.py
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Missing APPLE_CERTIFICATE}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD}"
          : "${KEYCHAIN_PASSWORD:?Missing KEYCHAIN_PASSWORD}"
          umask 077
          trap 'rm -f certificate.p12' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain | grep -Fq 'Developer ID Application: Aidoo Ltd. OOD (4KKVT2TUUA)'
      - run: npm ci
      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev
      - name: Verify third-party notices are current
        run: |
          python3 scripts/generate-third-party-notices.py
          git diff --exit-code -- resources/THIRD_PARTY_NOTICES.txt
      - name: Build, notarize and audit the website release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_PASSWORD:?Missing APPLE_PASSWORD}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          if [[ "$APPLE_TEAM_ID" != "4KKVT2TUUA" ]]; then
            echo "APPLE_TEAM_ID does not match the AIDOO signing team." >&2
            exit 1
          fi
          bash scripts/release-mac.sh
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain build.keychain || true
      - name: Store website release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidoo-whisper-lite-macos-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 14
